<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#090b10;color:#f5f7fb;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}
main{max-width:720px;margin:auto;padding:28px 18px 60px}
h1{font-size:30px;margin:10px 0}
.sub{color:#9ca3af;line-height:1.8;margin-bottom:25px}
.card{
  background:#12151d;border:1px solid #29303d;
  border-radius:22px;padding:20px;margin-bottom:18px
}
.upload{
  display:block;border:2px dashed #394253;border-radius:18px;
  padding:32px 15px;text-align:center;cursor:pointer
}
.upload strong{display:block;font-size:18px;margin-bottom:8px}
.upload span,.small{color:#9ca3af}
input[type=file]{display:none}
.preview{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:10px;margin-top:15px
}
.preview img{
  width:100%;height:150px;object-fit:cover;
  border-radius:12px;border:1px solid #333b49
}
label{display:block;color:#b6bdc9;margin:18px 0 8px}
input,select,textarea{
  width:100%;background:#0d1016;border:1px solid #343c4a;
  border-radius:14px;padding:15px;color:white;font-size:16px
}
textarea{min-height:100px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{
  width:100%;margin-top:22px;padding:17px;border:0;
  border-radius:15px;background:#637eea;color:white;
  font-size:18px;font-weight:700
}
button:disabled{opacity:.5}
.result{display:none}
.status{font-size:22px;font-weight:700;margin-bottom:12px}
.warning{color:#fbbf24}
#resultText{white-space:pre-wrap;line-height:1.8}
</style>
</head>

<body>
<main>

<h1>فحص الصفقة بالذكاء الاصطناعي</h1>

<div class="sub">
ارفع صور الشارت D1 / H4 / H1 / M15 / M5.
سيتم فحص الاتجاه والسيولة و BOS/CHOCH و FVG و Order Blocks.
</div>

<section class="card">

<label class="upload" for="shots">
<strong>📸 اضغط لاختيار صور الشارت</strong>
<span>يمكنك اختيار أكثر من صورة</span>
</label>

<input id="shots" type="file" accept="image/*" multiple>

<div id="count" class="small">لم يتم اختيار صور بعد.</div>
<div id="preview" class="preview"></div>

<label>الزوج</label>
<select id="symbol">
<option>XAUUSD</option>
<option>EURUSD</option>
<option>GBPUSD</option>
<option>BTCUSD</option>
</select>

<div class="row">
<div>
<label>رصيد الحساب $</label>
<input id="balance" type="number" value="100000">
</div>

<div>
<label>مخاطرة الصفقة %</label>
<input id="risk" type="number" value="1" step="0.1">
</div>
</div>

<label>الفريم الأساسي للدخول</label>
<select id="timeframe">
<option>M5</option>
<option selected>M15</option>
<option>H1</option>
<option>H4</option>
</select>

<label>ملاحظاتك / فكرتك</label>
<textarea id="notes"
placeholder="مثلاً: أفكر بيع بعد سحب سيولة فوق القمة + CHOCH"></textarea>

<button id="analyze">فحص الصفقة 🤖</button>

</section>

<section class="card result" id="result">
<div class="status" id="status">تحليل الشارت...</div>
<div id="resultText"></div>

<p class="warning">
⚠️ التحليل للمساعدة فقط وليس ضماناً للربح.
</p>
</section>

</main>

<script>
const shots = document.getElementById("shots");
const preview = document.getElementById("preview");
const count = document.getElementById("count");
const analyze = document.getElementById("analyze");
const result = document.getElementById("result");
const resultText = document.getElementById("resultText");
const statusText = document.getElementById("status");

shots.addEventListener("change", () => {
  preview.innerHTML = "";
  const files = [...shots.files];

  count.textContent = files.length
    ? `تم اختيار ${files.length} صورة`
    : "لم يتم اختيار صور بعد.";

  files.forEach(file => {
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    preview.appendChild(img);
  });
});

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

analyze.addEventListener("click", async () => {
  const files = [...shots.files];

  if(!files.length){
    alert("اختر صور الشارت أولاً.");
    return;
  }

  analyze.disabled = true;
  analyze.textContent = "جاري التحليل...";

  result.style.display = "block";
  statusText.textContent = "🤖 الذكاء الاصطناعي يحلل الصور...";
  resultText.textContent = "";

  try{
    const images = await Promise.all(
      files.map(file => fileToDataURL(file))
    );

    const response = await fetch("/api/analyze",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        images,
        symbol:document.getElementById("symbol").value,
        timeframe:document.getElementById("timeframe").value,
        balance:document.getElementById("balance").value,
        risk:document.getElementById("risk").value,
        notes:document.getElementById("notes").value
      })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || "فشل التحليل");
    }

    statusText.textContent = "📊 نتيجة التحليل";
    resultText.textContent = data.analysis || "لم تصل نتيجة.";

  }catch(error){
    statusText.textContent = "❌ حدث خطأ";
    resultText.textContent = error.message;
  }

  analyze.disabled = false;
  analyze.textContent = "فحص الصفقة 🤖";
  result.scrollIntoView({behavior:"smooth"});
});
</script>

</body>
</html>
