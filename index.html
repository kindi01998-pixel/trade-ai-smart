<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#090b10;
  color:#f5f7fb;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
main{
  max-width:720px;
  margin:auto;
  padding:28px 18px 60px;
}
h1{
  font-size:32px;
  margin:10px 0;
}
.sub{
  color:#9ca3af;
  line-height:1.8;
  margin-bottom:25px;
}
.card{
  background:#12151d;
  border:1px solid #29303d;
  border-radius:22px;
  padding:20px;
  margin-bottom:18px;
}
.upload{
  display:block;
  border:2px dashed #394253;
  border-radius:18px;
  padding:32px 15px;
  text-align:center;
  cursor:pointer;
}
.upload strong{
  display:block;
  font-size:18px;
  margin-bottom:8px;
}
.upload span{color:#9ca3af}
input[type=file]{display:none}

.preview{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
}
.preview img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid #333b49;
}

label{
  display:block;
  color:#b6bdc9;
  margin:18px 0 8px;
}
input,select,textarea{
  width:100%;
  background:#0d1016;
  border:1px solid #343c4a;
  border-radius:14px;
  padding:15px;
  color:white;
  font-size:16px;
}
textarea{
  min-height:100px;
  resize:vertical;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
button{
  width:100%;
  margin-top:22px;
  padding:17px;
  border:0;
  border-radius:15px;
  background:#637eea;
  color:white;
  font-size:18px;
  font-weight:700;
}
button:disabled{
  opacity:.5;
}
.result{
  display:none;
}
.status{
  font-size:22px;
  font-weight:700;
  margin-bottom:12px;
}
.warning{
  color:#fbbf24;
}
.small{
  color:#9ca3af;
  font-size:14px;
  line-height:1.6;
}
</style>
</head>

<body>
<main>

<h1>فحص الصفقة بالذكاء الاصطناعي</h1>

<div class="sub">
ارفع صور الشارت D1 / H4 / H1 / M15 / M5، وحدد رأس المال والمخاطرة.
سنجهز التحليل ليشمل الاتجاه، السيولة، BOS/CHOCH، FVG و Order Blocks.
</div>

<section class="card">

<label class="upload" for="shots">
<strong>📸 اضغط لاختيار صور الشارت</strong>
<span>يمكنك اختيار أكثر من صورة من iPhone</span>
</label>

<input id="shots" type="file" accept="image/*" multiple>

<div id="count" class="small">لم يتم اختيار صور بعد.</div>
<div id="preview" class="preview"></div>

<label>الزوج</label>
<select id="symbol">
<option>XAUUSD</option>
<option>EURUSD</option>
<option>GBPUSD</option>
<option>BTCUSD</option>
</select>

<div class="row">
<div>
<label>رصيد الحساب $</label>
<input id="balance" type="number" value="100000">
</div>

<div>
<label>مخاطرة الصفقة %</label>
<input id="risk" type="number" value="1" step="0.1">
</div>
</div>

<label>الفريم الأساسي للدخول</label>
<select id="timeframe">
<option>M5</option>
<option selected>M15</option>
<option>H1</option>
<option>H4</option>
</select>

<label>ملاحظاتك / فكرتك</label>
<textarea id="notes" placeholder="مثلاً: أفكر بيع بعد سحب سيولة فوق القمة + CHOCH"></textarea>

<button id="analyze">فحص الصفقة 🤖</button>

</section>

<section class="card result" id="result">
<div class="status">تحضير التحليل...</div>

<p id="resultText"></p>

<p class="warning">
⚠️ هذه الأداة للمساعدة في التحليل وإدارة المخاطر وليست ضماناً للربح.
</p>
</section>

</main>

<script>
const shots = document.getElementById("shots");
const preview = document.getElementById("preview");
const count = document.getElementById("count");
const analyze = document.getElementById("analyze");
const result = document.getElementById("result");
const resultText = document.getElementById("resultText");

shots.addEventListener("change", () => {

  preview.innerHTML = "";

  const files = [...shots.files];

  count.textContent = files.length
    ? `تم اختيار ${files.length} صورة`
    : "لم يتم اختيار صور بعد.";

  files.forEach(file => {
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    preview.appendChild(img);
  });
});

analyze.addEventListener("click", () => {

  const files = [...shots.files];

  if(!files.length){
    alert("اختر صور الشارت أولاً.");
    return;
  }

  const balance = document.getElementById("balance").value;
  const risk = document.getElementById("risk").value;
  const symbol = document.getElementById("symbol").value;
  const timeframe = document.getElementById("timeframe").value;

  result.style.display = "block";

  resultText.innerHTML =
  `تم استلام <b>${files.length}</b> صورة.<br><br>
   الزوج: <b>${symbol}</b><br>
   الفريم: <b>${timeframe}</b><br>
   الحساب: <b>$${balance}</b><br>
   المخاطرة: <b>${risk}%</b><br><br>
   واجهة التطبيق أصبحت جاهزة. الخطوة التالية هي ربط الصور بمحرك AI ليحلل الشارت فعلياً.`;

  result.scrollIntoView({behavior:"smooth"});
});
</script>

</body>
</html>
